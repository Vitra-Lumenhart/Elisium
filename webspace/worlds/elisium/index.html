<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elisium · Living Concordance 4.6</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#101827;overflow:hidden}iframe{display:block}</style></head><body><iframe title="Elisium · Living Concordance 4.6" src="elisium_native.html" allow="fullscreen"></iframe><script src="../../shared/world-nav.js"></script><a href="kilns/index.html?ws_v=1&amp;ws_entry=elisium-kilns-door" style="position:fixed;z-index:10;top:12px;right:12px;border:1px solid #bda274;background:#182938e9;color:#eed19c;border-radius:8px;padding:10px 14px;text-decoration:none;font:12px system-ui" title="Visit the independently navigable indoor house">⌂ Enter the Kilns</a><section id="kilnsReturnNotice" hidden aria-label="House echoes" style="position:fixed;z-index:11;left:12px;bottom:14px;max-width:min(340px,calc(100vw - 24px));background:#162636f5;color:#f1dfc0;border:1px solid #bfa474;border-radius:10px;padding:11px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 8px 30px #0009">
<button type="button" id="kilnsEchoToggle" aria-expanded="false" style="background:#57452d;border:1px solid #bc9b64;color:#f5ddaa;padding:8px 11px;border-radius:7px;cursor:pointer">⌂ House echoes</button>
<div id="kilnsEchoDetails" hidden><p id="kilnsEchoSummary"></p><ul id="kilnsEchoItems" style="padding-left:22px;max-height:32vh;overflow:auto"></ul><small>Only named observations cross. The private journal stays inside; the sky simulation remains independent.</small></div></section>
<script src="threshold.js"></script><script>
(()=>{'use strict';const bridge=window.ElisiumThreshold,record=bridge.consume(sessionStorage);
if(!record||!record.observations.length)return;
const card=document.getElementById('kilnsReturnNotice'),toggle=document.getElementById('kilnsEchoToggle'),details=document.getElementById('kilnsEchoDetails'),list=document.getElementById('kilnsEchoItems');
document.getElementById('kilnsEchoSummary').textContent=record.observations.length+' discoveries across '+record.elapsed_minutes+' fictional interior minutes.';
for(const o of record.observations){const li=document.createElement('li');li.textContent=o.id+' · '+bridge.meanings[o.id];list.append(li)}
toggle.textContent='⌂ House echoes · '+record.observations.length;toggle.addEventListener('click',()=>{details.hidden=!details.hidden;toggle.setAttribute('aria-expanded',String(!details.hidden))});card.hidden=false;
})();
</script></body></html>
