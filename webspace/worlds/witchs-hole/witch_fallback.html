<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Witch's Hole · Canvas Compatibility Survey</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#07191c;color:#ebdfc6;font-family:Georgia,serif}canvas{width:100%;height:100%;display:block}#top{position:absolute;top:0;left:0;right:0;padding:18px 23px;background:linear-gradient(#071619ed,#07161900);pointer-events:none}h1{font-size:27px;font-weight:400;margin:5px 0}p{margin:2px 0;color:#bfcecb}#routes{position:absolute;bottom:12px;left:12px;right:12px;padding:12px 14px;background:#0d2529eb;border:1px solid #a8ac806b;box-shadow:0 4px 30px #0009;border-radius:9px}button{cursor:pointer;background:#244349;border:1px solid #a4b79a6d;color:#e5e3d0;font:13px system-ui;padding:8px 11px;margin:3px;border-radius:6px}button:focus-visible{outline:2px solid #ffdc9d}#roots{background:#796038}small{color:#9cb4af}.info{font-size:14px;line-height:1.5;max-width:650px}#map{position:absolute;right:14px;top:110px;width:176px;height:auto;background:#102d31db;padding:12px;border:1px solid #8fa69d73;border-radius:7px;font:12px system-ui}#map button{display:block;text-align:left;width:100%;font:11px system-ui;padding:5px;margin:2px 0}@media(max-width:680px){#map{display:none}#routes{font-size:12px}h1{font-size:21px}#top{padding:12px}}
</style></head><body><canvas id="scene"></canvas><div id="top"><small>WITCH'S HOLE · CANVAS COMPATIBILITY SURVEY</small><h1 id="title">The Arrival Cairn</h1><p class="info" id="desc">The ravine exhales beneath crooked trees.</p></div><div id="map"><strong>PLACES DISCOVERED</strong><div id="locations"></div></div><div id="routes"><small>NODE-LOCKED PATHS · REDUCED REPRESENTATION OF THE ORIGINAL 3D WORLD</small><div id="choices"></div><div id="actions"></div></div>
<script>
const sites=[
['arrival','The Arrival Cairn',-22,73,'A threshold stands behind you. Mist leads into the ravine.',['lookout','cleft']],
['lookout','The Overlook',-30,52,'The mist gathers far below. You may glimpse the cliff vent.',['arrival','bridge']],
['cleft','The Cold Cleft',31,43,'Cold air drains between broken stones.',['arrival','basin']],
['bridge','The Ravine Cliff',-33,17,'The trail stops against a dense web of roots.',['lookout','hollow']],
['hollow','The Root Hollow',-22,9,'A tree-hollow passage carries basin mist through the ravine.',['bridge','brook','basin']],
['basin',"The Witch's Basin",24,12,'Cold water and humid air trap a tide of mist.',['cleft','hollow','hut']],
['brook','The Whispering Brook',-15,-4,'The stream and the air move at different speeds.',['hollow','hut','siphon']],
['hut','The Huckleberry Hut',29,-23,'An abandoned desk holds a journal and a lantern.',['basin','brook','weir']],
['siphon','The Stone Siphon',-34,-38,'Water passes where a traveler cannot.',['brook','outflow']],
['weir','The Old Weir',22,-54,'A stiff sluice changes the water and downstream fog.',['hut','outflow']],
['outflow','The Outflow',-23,-67,'Two threads of cold mist separate in warmer air.',['siphon','weir']]
];
const dict=Object.fromEntries(sites.map(s=>[s[0],s]));let now='arrival',count=0,found=new Set([now]),wet=0;
const by=id=>document.getElementById(id),c=by('scene'),ctx=c.getContext('2d');
function open(){return count>=12}
function links(){return dict[now][5].filter(x=>x!=='hollow'||open())}
function choose(id){now=id;found.add(id);update()}
function button(text,fn,kind=''){const b=document.createElement('button');b.textContent=text;if(kind)b.id=kind;b.onclick=fn;return b}
function update(){const s=dict[now];by('title').textContent=s[1];by('desc').textContent=s[4];by('choices').replaceChildren(...links().map(id=>button('↗ '+dict[id][1],()=>choose(id))));let ac=[];if(now==='bridge'&&!open())ac.push(button('Break roots '+count+'/12',()=>{count++;update()},'roots'));if(now==='arrival')ac.push(button('◈ Return to Garden',()=>location.assign('../chuzhoy/index.html?ws_v=1&ws_entry=chuzhoy-north')));if(now==='weir')ac.push(button('Adjust sluice',()=>{wet=1-wet;update()}));if(now==='hollow')ac.push(button('Listen to the wind',()=>alert('The Basin sends its mist through the opened root tunnel.')));by('actions').replaceChildren(...ac);by('locations').replaceChildren(...[...found].map(id=>button(dict[id][1],()=>choose(id))));}
function draw(t){const w=c.width=innerWidth,h=c.height=innerHeight;const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#0a2025');sky.addColorStop(.65,'#345157');sky.addColorStop(1,'#081a1e');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let i=0;i<48;i++){const x=(i*170.1)%w,y=.18*h+Math.sin(i*4.2)*h*.12;ctx.fillStyle='rgba(5,25,27,.65)';ctx.beginPath();ctx.moveTo(x-25,h);ctx.lineTo(x,y);ctx.lineTo(x+20,h);ctx.fill();}ctx.save();ctx.translate(w*.5,h*.52);const fac=Math.min(w*.010,h*.008);ctx.strokeStyle='#a5cfc680';ctx.lineWidth=2;for(const s of sites){if(s[0]==='hollow'&&!open())continue;const x=s[2]*fac,z=-s[3]*fac;for(const dest of s[5]){if(dest==='hollow'&&!open())continue;const d=dict[dest];ctx.beginPath();ctx.moveTo(x,z);ctx.lineTo(d[2]*fac,-d[3]*fac);ctx.stroke()}}for(const s of sites){if(s[0]==='hollow'&&!open())continue;const x=s[2]*fac,z=-s[3]*fac;ctx.fillStyle=s[0]===now?'#ffdf91':found.has(s[0])?'#9cdad0':'#385b60';ctx.beginPath();ctx.arc(x,z,s[0]===now?8:5,0,Math.PI*2);ctx.fill()}ctx.restore();for(let i=0;i<45;i++){const x=(i*77+t*.008)%w,y=h*.36+(i*29)%Math.max(h*.42,1);ctx.fillStyle='rgba(171,211,204,'+(Math.sin(t*.0003+i)*.05+.07)+')';ctx.beginPath();ctx.ellipse(x,y,60,5,0,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}update();requestAnimationFrame(draw);
</script></body></html>
